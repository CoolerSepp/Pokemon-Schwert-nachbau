<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Aetheria - ein eigenstaendiges 3D-Monster-RPG im Browser." />
    <title>Aetheria</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%237fc44b'/><circle cx='16' cy='16' r='5' fill='%23fff'/></svg>" />
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="ui-root"></div>
      <div id="boot-screen">
        <div class="boot-inner">
          <h1 class="boot-title">AETHERIA</h1>
          <p class="boot-subtitle">Ein Monster-RPG</p>
          <div class="boot-bar"><div class="boot-bar-fill" id="boot-progress"></div></div>
          <p class="boot-status" id="boot-status">Inhalte werden geladen ...</p>
        </div>
      </div>
    </div>
    <script>
      // Diese Datei ist der Einstiegspunkt fuer den Entwicklungsserver und
      // laedt TypeScript-Module. Ueber "file://" kann der Browser das nicht -
      // dann bliebe nur ein haengender Ladebildschirm. Deshalb hier ein
      // klarer Hinweis auf die spielbare Einzeldatei.
      if (window.location.protocol === 'file:') {
        document.addEventListener('DOMContentLoaded', function () {
          var screenEl = document.getElementById('boot-screen');
          if (!screenEl) return;
          screenEl.innerHTML = ''
            + '<div style="max-width:640px;margin:12vh auto;padding:28px 32px;'
            + 'font-family:system-ui,sans-serif;line-height:1.7;color:#e8eef5;'
            + 'background:#161c26;border:1px solid #2e3947;border-radius:14px">'
            + '<h1 style="margin:0 0 12px;font-size:26px;letter-spacing:2px">AETHERIA</h1>'
            + '<p style="margin:0 0 18px;color:#9fb4c8">Diese Datei ist nur der '
            + 'Einstiegspunkt fuer die Entwicklung und braucht einen Server.</p>'
            + '<p style="margin:0 0 10px"><strong>Zum Spielen:</strong> oeffne im '
            + 'selben Ordner die Datei</p>'
            + '<p style="margin:0 0 18px"><a href="release/Aetheria.html" '
            + 'style="color:#7fc44b;font-size:18px;font-weight:700">release/Aetheria.html</a></p>'
            + '<p style="margin:0;color:#9fb4c8">Sie enthaelt das vollstaendige Spiel '
            + 'in einer einzigen Datei - ohne Server und ohne Installation.</p>'
            + '</div>';
          screenEl.setAttribute(
            'style',
            'position:fixed;inset:0;z-index:99;overflow:auto;background:#0d1117',
          );
        });
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
